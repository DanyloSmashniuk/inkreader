name: windows-build
# Збирає InkReader для Windows і додає інсталятор InkReader-setup.exe до релізу v<версія з buildozer.spec>.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/build_windows.ps1', 'scripts/installer.iss', '.github/workflows/windows.yml', 'buildozer.spec']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # На віртуальній машині немає відеокарти: Kivy під час збірки має працювати через ANGLE (програмний OpenGL ES)
      KIVY_GL_BACKEND: angle_sdl2
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Збірка
        shell: pwsh
        timeout-minutes: 20
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: InkReader-setup
          path: dist/InkReader-setup.exe
      - name: Додати до релізу
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E '^version *=' buildozer.spec | head -1 | sed -E 's/^version *= *//' | tr -d '\r ')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/InkReader-setup.exe --clobber
            gh release delete-asset "$TAG" InkReader-windows.zip -y 2>/dev/null || true
            echo "Завантажено в реліз $TAG"
          else
            echo "Релізу $TAG ще немає: архів лише в артефактах цього запуску"
          fi
